# fly launch --no-deploy --copy-config ; fly volumes create anchor_data --size 1 ; fly secrets set TREASURY_SECRET=S... ; fly deploy
app = "tr-mock-anchor"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DB_PATH = "/data/anchor.db"
  PUBLIC_URL = "https://tr-mock-anchor.fly.dev"
  STELLAR_MODE = "live"
  RATE_SOURCE = "reflector"

[mounts]
  source = "anchor_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"   # workers must keep running to settle on-ramps / watch off-ramps
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"
